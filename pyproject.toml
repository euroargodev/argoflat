[project]
name = "argoflat"
version = "0.1.0"
description = "ARGOFLAT: The Argo dataset as a lossless, analysis-ready cloud-optimised contiguous ragged array"
readme = "README.md"
authors = [
    { name = "Guillaume Maze", email = "gmaze@ifremer.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "argopy==1.5",
    "bokeh>=3.10.1",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "fsspec>=2026.9.0",
    "netcdf4>=1.7.5.1.post1",
    "pyarrow>=26.0.0",
    "s3fs>=2026.9.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "pypi>=2.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]
