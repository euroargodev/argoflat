[project]
name = "argoflat"
version = "0.1.0rc1"
description = "ARGOFLAT: The Argo dataset as a lossless, analysis-ready cloud-optimised contiguous ragged array"
readme = "README.md"
authors = [
    { name = "Guillaume Maze", email = "gmaze@ifremer.fr" }
]
classifiers = [
        "Programming Language :: Python :: 3.12",
        "Topic :: Scientific/Engineering",
        "Intended Audience :: Science/Research",
        "Operating System :: OS Independent",
        "Operating System :: POSIX",
        "Operating System :: MacOS",
        "Operating System :: Microsoft :: Windows",
        "Development Status :: 1 - Planning",
        "Natural Language :: English",
]
license-files = ["LICENSE"]

requires-python = ">=3.12"
dependencies = [
    "argopy==1.5",
    "bokeh>=3.10.1",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "netcdf4>=1.7.5.1.post1",
    "pyarrow>=26.0.0",
    "s3fs>=2026.9.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "cf-xarray>=0.11.3",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pypi>=2.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
